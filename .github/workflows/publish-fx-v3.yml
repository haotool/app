# v3 release 發布（reusable workflow）
#
# 職責：由 update-latest-rates.yml／update-moneybox-rates.yml 在 v2 job 之後呼叫，
# 以觸發 SHA 的 publisher 產生並提交 public/rates/v3/。
#
# 隔離原則：
# ✅ 獨立 concurrency group；v2 使用非 force fast-forward push，競態時 rebase 或安全失敗
# ✅ data checkout 不保存 credentials；token 只在 push 步驟以 http.extraheader 注入
# ✅ 失敗時本 job 標紅（不使用 continue-on-error）；v2 資料已於前一個 job 完成 commit／purge

name: Publish FX v3 release

on:
  workflow_call:
    inputs:
      provider:
        description: 'v3 provider id（bot / moneybox）'
        required: true
        type: string
      fetch-failed:
        description: '同一 run 的 v2 抓取是否失敗（記錄為 provider checkStatus）'
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: fx-v3-publish
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout data branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: data
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout the complete publisher at the triggering code SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: _fx-code
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Install exact publisher dependencies
        working-directory: _fx-code
        run: |
          corepack enable
          # corepack 下載 pnpm 偶發 undici 連線中斷（assert(!this.paused)），重試 3 次避免暫時性網路錯誤紅燈
          for attempt in 1 2 3; do
            corepack pnpm install --frozen-lockfile --ignore-scripts && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "::warning::pnpm install 第 ${attempt} 次失敗，10 秒後重試"
            sleep 10
          done
          corepack pnpm generate:fx --check

      - name: Capture previously published providers
        id: previous-providers
        env:
          FX_PROVIDER: ${{ inputs.provider }}
        run: |
          providers="$(node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const root = path.join(process.env.GITHUB_WORKSPACE, "public/rates/v3");
            const currentPath = path.join(root, "current.json");
            const previous = fs.existsSync(currentPath)
              ? JSON.parse(fs.readFileSync(currentPath, "utf8"))
              : null;
            const manifest = previous
              ? JSON.parse(fs.readFileSync(path.join(root, previous.manifest.path), "utf8"))
              : null;
            const providers = new Set([
              ...(manifest?.providers ?? []).map(({ providerId }) => providerId),
              process.env.FX_PROVIDER,
            ]);
            process.stdout.write([...providers].join(","));
          ')"
          echo "FX_REQUIRED_PROVIDERS=$providers" >> "$GITHUB_ENV"

      - name: Publish verified v3 release
        env:
          FX_PROVIDER: ${{ inputs.provider }}
          FX_DATA_ROOT: ${{ github.workspace }}/public/rates
          FX_FETCH_FAILED: ${{ inputs.fetch-failed && '1' || '0' }}
        run: node _fx-code/scripts/publish-fx-release.mjs

      - name: Verify published v3 release
        run: |
          node _fx-code/scripts/verify-fx-v3-release.mjs \
            --data-root "$GITHUB_WORKSPACE/public/rates" \
            --require-providers "$FX_REQUIRED_PROVIDERS"

      - name: Commit, push and purge v3 pointer
        if: success()
        env:
          COMMIT_MESSAGE: 'chore(rates): publish ${{ inputs.provider }} v3 release'
          GIT_PUSH_TOKEN: ${{ github.token }}
        run: bash _fx-code/scripts/commit-fx-v3-release.sh "$COMMIT_MESSAGE"
