name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'scripts/build-pages.mjs'
      - 'scripts/generate-sitemap-2025.mjs'
      - 'scripts/generate-sitemap-2026.mjs'
      - 'scripts/verify-image-resources.mjs'
      - 'scripts/verify-ssot-sync.mjs'
      - 'scripts/lib/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'scripts/build-pages.mjs'
      - 'scripts/generate-sitemap-2025.mjs'
      - 'scripts/generate-sitemap-2026.mjs'
      - 'scripts/verify-image-resources.mjs'
      - 'scripts/verify-ssot-sync.mjs'
      - 'scripts/lib/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - '.github/workflows/deploy-pages.yml'
permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    name: Build and deploy Pages
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      PAGES_PROJECT_NAME: haotool-static

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 9.10.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Pages assets
        env:
          # This is a public application endpoint, not a credential. Keep it explicit so
          # both the client bundle and the build-time rating snapshot use the same API.
          VITE_RATING_API_URL: https://app.haotool.org/ratewise/api/ratings
          RATING_API_URL: https://app.haotool.org/ratewise/api/ratings
        run: pnpm build:pages

      - name: Install Wrangler CLI
        run: npm ci --prefix security-headers --ignore-scripts

      - name: Validate Wrangler CLI
        run: security-headers/node_modules/.bin/wrangler --version

      - name: Verify Pages output contract
        run: |
          set -euo pipefail
          test -f .pages-dist/index.html
          test -f .pages-dist/404.html
          test -f .pages-dist/health
          test -f .pages-dist/_headers
          test -f .pages-dist/_redirects
          for app in ratewise nihonname quake-school park-keeper split-meow starpuff papertrade; do
            test -f ".pages-dist/$app/index.html"
          done

      - name: Deploy Pages
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_EVENT_NAME: ${{ github.event_name }}
          DEPLOY_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || {
            echo '::error::CLOUDFLARE_API_TOKEN is unavailable for this trusted deployment context.'
            exit 1
          }
          if [ "$DEPLOY_EVENT_NAME" = "pull_request" ]; then
            DEPLOY_BRANCH="$DEPLOY_REF"
          else
            DEPLOY_BRANCH="candidate-$GITHUB_SHA"
          fi
          DEPLOY_OUTPUT="$(security-headers/node_modules/.bin/wrangler pages deploy .pages-dist \
            --project-name "$PAGES_PROJECT_NAME" \
            --branch "$DEPLOY_BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "$GITHUB_SHA")"
          printf '%s\n' "$DEPLOY_OUTPUT"
          DEPLOY_URL="$(printf '%s\n' "$DEPLOY_OUTPUT" | grep -Eo 'https://[^[:space:]]+\.pages\.dev' | tail -1)"
          test -n "$DEPLOY_URL"
          echo "deployment_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Verify SEO parity against production
        env:
          CANDIDATE_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          pnpm exec node scripts/verify-pages-seo-parity.mjs \
            --candidate-url="$CANDIDATE_URL" \
            --contract-only \
            --api-url=https://app.haotool.org/ratewise/api/ratings

      - name: Promote Pages production
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          security-headers/node_modules/.bin/wrangler pages deploy .pages-dist \
            --project-name "$PAGES_PROJECT_NAME" \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "$GITHUB_SHA"

      - name: Publish deployment summary
        if: always()
        env:
          SUMMARY_BRANCH: ${{ github.head_ref || github.ref_name }}
          SUMMARY_URL: ${{ steps.deploy.outputs.deployment_url || 'deployment failed' }}
        run: |
          {
            echo "### Cloudflare Pages"
            echo "- Project: \`$PAGES_PROJECT_NAME\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Branch: \`$SUMMARY_BRANCH\`"
            echo "- URL: \`$SUMMARY_URL\`"
          } >> "$GITHUB_STEP_SUMMARY"
