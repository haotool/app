version: 2
updates:
  # pnpm workspace 根目錄：apps/* 共用同一份 pnpm-lock.yaml，由此單一 entry 涵蓋。
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'sunday'
      time: '02:00'
      timezone: 'Asia/Taipei'
    commit-message:
      prefix: 'chore(deps)'
    allow:
      - dependency-type: 'direct'
    open-pull-requests-limit: 5
    rebase-strategy: auto
    versioning-strategy: increase-if-necessary
    # minor/patch 收斂成單一 PR，避免每個套件各開一個 PR 與一封通知；
    # major 刻意不分組——需要逐案評估相容性（例：react-router v7 與 vite-react-ssg 耦合），
    # 混進群組 PR 會讓其他安全更新一起被卡住。
    groups:
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # 2026-08-08: runtime 鎖在 Node 24（engines ^24.0.0 / .nvmrc / CI node-version 24）。
      # 型別 major 先行會描述執行期不存在的 API，型別檢查綠燈也擋不住執行期失敗。
      # 待 runtime 整體升版後再一併解除（PR #969 因此關閉）。
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # React Router v7 需要同步驗證 vite-react-ssg、路由 API 與所有 workspace；
      # 不允許 Dependabot 只改各 app 與 lockfile，卻遺漏 root pnpm.overrides。
      - dependency-name: 'react-router-dom'
        update-types: ['version-update:semver-major']
      # 2026-10-03: eslint-plugin-react-hooks 7.1.x 新增 set-state-in-effect 等規則，
      # 升級後 CI lint 出現多處新錯誤（35 個套件群組 PR #1157 因此被卡住）。
      # 先排除 minor（patch 仍會更新），待逐一評估並修正對應程式碼後再解除。
      - dependency-name: 'eslint-plugin-react-hooks'
        update-types: ['version-update:semver-minor']
      # 2026-10-03: CI 的 E2E 跑在 mcr.microsoft.com/playwright:vX.Y.Z-noble 容器（ci.yml），
      # 瀏覽器版本與 @playwright/test 綁定；只升套件不升映像會讓所有 E2E 以
      # 「chromium_headless_shell 不存在」失敗（群組 PR #1177）。
      # 升級時須手動讓 package.json 與 ci.yml 兩處映像標籤同步，故排除所有版本。
      - dependency-name: '@playwright/test'
      # 2026-10-03: typescript-eslint 8.64 → 8.71 使 unbound-method 在測試檔新增 8 個錯誤
      # （useNavigation / storage / voidra 等 *.test.*）。先排除 minor，
      # 待決定對測試檔關閉該規則或逐一修正後再解除。
      - dependency-name: 'typescript-eslint'
        update-types: ['version-update:semver-minor']
      - dependency-name: '@typescript-eslint/*'
        update-types: ['version-update:semver-minor']
      # 2026-10-04: prettier 3.8.1 → 3.9.9 使 `pnpm format`（CI Format check）在 36 個既有檔案失敗。
      # 為避免與升級無關的大量格式化雜訊混進依賴 PR，先排除 minor；
      # 升級時應另開 PR 同時執行 `pnpm format:fix` 並單獨審查格式差異。
      - dependency-name: 'prettier'
        update-types: ['version-update:semver-minor']

  # security-headers Worker 自帶 npm + package-lock.json，不在 pnpm workspace 內，
  # 沒有這個 entry 就只會在漏洞警報觸發時被動冒出 security update PR（例：PR #979）。
  - package-ecosystem: 'npm'
    directory: '/security-headers'
    schedule:
      interval: 'weekly'
      day: 'sunday'
      time: '02:00'
      timezone: 'Asia/Taipei'
    commit-message:
      prefix: 'chore(deps)'
    allow:
      - dependency-type: 'direct'
    open-pull-requests-limit: 3
    rebase-strategy: auto
    groups:
      security-headers-minor-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '01:00'
      timezone: 'Asia/Taipei'
    commit-message:
      prefix: 'chore(ci)'
    open-pull-requests-limit: 3
    # action 升級彼此獨立且風險同質，全部收成一個 PR。
    groups:
      github-actions:
        patterns:
          - '*'
    ignore:
      # 2026-10-03: changesets/action v2 破壞性變更——release commit／tag 預設改用 GitHub API 推送，
      # 且自訂 token 必須透過 github-token input 明確傳入（環境變數與 checkout 憑證不再生效），
      # `commit-mode` input 也被取代。release.yml 目前依賴 v1 的 commit／title inputs 與
      # GITHUB_TOKEN／RELEASE_PAT 補償鏈，需先改寫並驗證 release 流程再升級。
      - dependency-name: 'changesets/action'
        update-types: ['version-update:semver-major']
